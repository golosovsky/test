name: Test Bus API Proxies

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test-proxies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test busnearby API directly
        run: |
          echo "::group::Direct API"
          HTTP_CODE=$(curl -s -o /tmp/direct.json -w "%{http_code}" \
            --max-time 15 \
            "https://app.busnearby.co.il/stopSearch?query=%D7%90%D7%95%D7%93%D7%99%D7%9D&locale=he" \
            -H "User-Agent: Mozilla/5.0" \
            -H "Referer: https://app.busnearby.co.il/")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "DIRECT=ok" >> $GITHUB_ENV
            echo "Response (first 200 chars):"
            head -c 200 /tmp/direct.json
          else
            echo "DIRECT=fail" >> $GITHUB_ENV
          fi
          echo "::endgroup::"

      - name: Test allorigins.win proxy
        run: |
          echo "::group::allorigins.win"
          HTTP_CODE=$(curl -s -o /tmp/allorigins.json -w "%{http_code}" \
            --max-time 15 \
            "https://api.allorigins.win/raw?url=https%3A%2F%2Fapp.busnearby.co.il%2FstopSearch%3Fquery%3D%25D7%2590%25D7%2595%25D7%2593%25D7%2599%25D7%259D%26locale%3Dhe")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "ALLORIGINS=ok" >> $GITHUB_ENV
            head -c 200 /tmp/allorigins.json
          else
            echo "ALLORIGINS=fail" >> $GITHUB_ENV
            cat /tmp/allorigins.json 2>/dev/null || true
          fi
          echo "::endgroup::"

      - name: Test corsproxy.io
        run: |
          echo "::group::corsproxy.io"
          HTTP_CODE=$(curl -s -o /tmp/corsproxy.json -w "%{http_code}" \
            --max-time 15 \
            "https://corsproxy.io/?https%3A%2F%2Fapp.busnearby.co.il%2FstopSearch%3Fquery%3D%25D7%2590%25D7%2595%25D7%2593%25D7%2599%25D7%259D%26locale%3Dhe")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "CORSPROXY=ok" >> $GITHUB_ENV
            head -c 200 /tmp/corsproxy.json
          else
            echo "CORSPROXY=fail" >> $GITHUB_ENV
            cat /tmp/corsproxy.json 2>/dev/null || true
          fi
          echo "::endgroup::"

      - name: Test codetabs.com proxy
        run: |
          echo "::group::codetabs.com"
          HTTP_CODE=$(curl -s -o /tmp/codetabs.json -w "%{http_code}" \
            --max-time 15 \
            "https://api.codetabs.com/v1/proxy?quest=https%3A%2F%2Fapp.busnearby.co.il%2FstopSearch%3Fquery%3D%25D7%2590%25D7%2595%25D7%2593%25D7%2599%25D7%259D%26locale%3Dhe")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "CODETABS=ok" >> $GITHUB_ENV
            head -c 200 /tmp/codetabs.json
          else
            echo "CODETABS=fail" >> $GITHUB_ENV
            cat /tmp/codetabs.json 2>/dev/null || true
          fi
          echo "::endgroup::"

      - name: Test stoptimes endpoint via allorigins
        run: |
          echo "::group::Stoptimes API"
          NOW=$(date +%s)
          # stop 16264 is a known Udim-area stop
          URL="https://api.busnearby.co.il/directions/index/stops/1:16264/stoptimes?numberOfDepartures=3&timeRange=7200&startTime=${NOW}&locale=he"
          HTTP_CODE=$(curl -s -o /tmp/times.json -w "%{http_code}" \
            --max-time 15 \
            "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$URL', safe=''))")")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "TIMES=ok" >> $GITHUB_ENV
            head -c 500 /tmp/times.json
          else
            echo "TIMES=fail" >> $GITHUB_ENV
            cat /tmp/times.json 2>/dev/null || true
          fi
          echo "::endgroup::"

      - name: Summary
        run: |
          echo "## API Proxy Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Proxy | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Direct busnearby | ${{ env.DIRECT || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| allorigins.win | ${{ env.ALLORIGINS || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| corsproxy.io | ${{ env.CORSPROXY || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| codetabs.com | ${{ env.CODETABS || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stoptimes (allorigins) | ${{ env.TIMES || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY

  test-page:
    runs-on: ubuntu-latest
    needs: test-proxies
    steps:
      - uses: actions/checkout@v4

      - name: Serve and test page with Playwright
        run: |
          npm init -y > /dev/null 2>&1
          npx -y playwright@latest install --with-deps chromium > /dev/null 2>&1

          # Serve the HTML
          python3 -m http.server 8080 &
          sleep 2

          # Test with Playwright
          cat > test.mjs << 'TESTEOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();

          // Listen to console
          page.on('console', msg => console.log('BROWSER:', msg.text()));
          page.on('pageerror', err => console.error('PAGE_ERROR:', err.message));

          console.log('Loading page...');
          await page.goto('http://localhost:8080/index.html?debug=1');
          await page.waitForTimeout(3000);

          // Check if search results appeared or error
          const content = await page.textContent('body');
          if (content.includes('שגיאה')) {
            console.log('ERROR: Search failed');
            console.log('Page content:', content.substring(0, 500));
            process.exit(1);
          } else if (content.includes('קוד תחנה') || content.includes('תחנה נבחרת')) {
            console.log('SUCCESS: Search results or saved stop found');
          } else {
            console.log('UNKNOWN STATE');
            console.log('Page content:', content.substring(0, 500));
          }

          await browser.close();
          TESTEOF

          npx playwright test --config=<(echo '') 2>/dev/null || node test.mjs
