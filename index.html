<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netanya Surf Conditions</title>
  <style>
    :root {
      --ocean: #0077b6;
      --sky: #90e0ef;
      --foam: #caf0f8;
      --sand: #f4e4c1;
      --green: #2dc653;
      --yellow: #f5c518;
      --orange: #f4811f;
      --red: #e63946;
      --card-bg: rgba(255,255,255,0.92);
      --text: #023e8a;
      --muted: #5a7ea0;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #0096c7 0%, #48cae4 40%, #90e0ef 80%, var(--sand) 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 16px;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 20px 0 12px;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
      letter-spacing: -0.5px;
    }
    header p.subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      margin-top: 4px;
    }
    #update-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    #last-updated {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.8);
    }
    #refresh-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #refresh-btn:hover { background: rgba(255,255,255,0.4); }
    #refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* BEST BEACH BANNER */
    #best-banner {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin: 14px auto;
      max-width: 640px;
      text-align: center;
      display: none;
    }
    #best-banner h2 {
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
      margin-bottom: 4px;
    }
    #best-beach-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }
    #best-beach-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.85);
      margin-top: 2px;
    }

    /* ACTIVITY FILTER */
    #activity-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px auto;
      max-width: 640px;
    }
    .activity-tab {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.9);
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .activity-tab.active {
      background: #fff;
      color: var(--ocean);
      border-color: #fff;
    }

    /* LOADING / ERROR */
    #status-msg {
      text-align: center;
      color: rgba(255,255,255,0.9);
      padding: 40px;
      font-size: 1rem;
    }

    /* CARDS GRID */
    #cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* BEACH CARD */
    .beach-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,80,160,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .beach-card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,80,160,0.22); }
    .beach-card.best-card { border: 2px solid #ffd700; }

    .card-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .beach-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ocean);
    }
    .beach-desc {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .best-badge {
      display: none;
      background: #ffd700;
      color: #7a5c00;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      margin-left: 8px;
    }
    .beach-card.best-card .best-badge { display: inline-block; }

    /* SCORES ROW */
    .scores-row {
      display: flex;
      justify-content: space-around;
      padding: 12px 8px;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .score-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      border: 3px solid;
      position: relative;
    }
    .score-ring .score-num { line-height: 1; }
    .score-ring .score-max { font-size: 0.55rem; font-weight: 500; opacity: 0.7; line-height: 1; }
    .score-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); }
    .score-emoji { font-size: 1.05rem; margin-bottom: 2px; }

    /* Score colors */
    .s-great  { color: var(--green);  border-color: var(--green);  background: #edfaf1; }
    .s-good   { color: #5aab2a;        border-color: #5aab2a;        background: #f3fbed; }
    .s-fair   { color: var(--yellow); border-color: var(--yellow); background: #fefae0; }
    .s-poor   { color: var(--orange); border-color: var(--orange); background: #fff3e6; }
    .s-bad    { color: var(--red);    border-color: var(--red);    background: #fdf0f1; }

    /* QUICK STATS */
    .quick-stats {
      display: flex;
      justify-content: space-around;
      padding: 6px 12px 10px;
      background: rgba(0,119,182,0.04);
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .quick-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .qs-val { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .qs-key { font-size: 0.65rem; color: var(--muted); font-weight: 500; }

    /* DETAILS BUTTON */
    .details-btn {
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid rgba(0,0,0,0.07);
      padding: 9px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ocean);
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s;
    }
    .details-btn:hover { background: rgba(0,119,182,0.05); }

    /* MODAL */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,20,60,0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: #fff;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 0 0 40px;
      animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 36px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .modal-header {
      padding: 14px 20px 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 1.15rem; font-weight: 800; color: var(--ocean); }
    #modal-close {
      background: #f0f0f0;
      border: none;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-section {
      padding: 14px 20px 0;
    }
    .modal-section h3 {
      font-size: 0.68rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .detail-cell {
      background: #f7faff;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .detail-cell .dc-val { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .detail-cell .dc-key { font-size: 0.7rem; color: var(--muted); font-weight: 500; margin-top: 1px; }

    /* FORECAST TABLE */
    .forecast-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-top: 8px;
    }
    .forecast-table th {
      text-align: center;
      padding: 6px 4px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid #eee;
    }
    .forecast-table td {
      text-align: center;
      padding: 7px 4px;
      border-bottom: 1px solid #f5f5f5;
      font-weight: 500;
    }
    .forecast-table tr:last-child td { border-bottom: none; }
    .forecast-table .score-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* ACTIVITY SCORES in MODAL */
    .modal-scores {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 4px 0 8px;
    }
    .modal-score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: #f7faff;
      border-radius: 12px;
      padding: 10px 18px;
      flex: 1;
    }
    .modal-score-item .act-icon { font-size: 1.4rem; }
    .modal-score-item .act-score { font-size: 1.3rem; font-weight: 800; }
    .modal-score-item .act-label { font-size: 0.68rem; color: var(--muted); font-weight: 600; }

    /* Condition label */
    .cond-label {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .cond-great  { background: #edfaf1; color: var(--green); }
    .cond-good   { background: #f3fbed; color: #5aab2a; }
    .cond-fair   { background: #fefae0; color: #c49a00; }
    .cond-poor   { background: #fff3e6; color: var(--orange); }
    .cond-bad    { background: #fdf0f1; color: var(--red); }

    @media (max-width: 380px) {
      #cards-grid { grid-template-columns: 1fr; }
      .score-ring { width: 50px; height: 50px; font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>🏄 Netanya Surf</h1>
  <p class="subtitle">Real-time beach conditions · Mediterranean</p>
  <div id="update-bar">
    <span id="last-updated">Loading…</span>
    <button id="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<div id="best-banner">
  <h2>Best right now</h2>
  <div id="best-beach-name">—</div>
  <div id="best-beach-sub">—</div>
</div>

<div id="activity-tabs">
  <button class="activity-tab active" onclick="setTab('surf',this)">🏄 Surf</button>
  <button class="activity-tab" onclick="setTab('sup',this)">🏄‍♂️ SUP</button>
  <button class="activity-tab" onclick="setTab('kayak',this)">🚣 Kayak</button>
  <button class="activity-tab" onclick="setTab('all',this)">All</button>
</div>

<div id="status-msg">Fetching ocean data…</div>
<div id="cards-grid" style="display:none"></div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-beach-name">—</div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── Beach definitions ──────────────────────────────────────────────
const BEACHES = [
  { id:'poleg',   name:'Poleg',   lat:32.3040, lon:34.8560, desc:'Main surf beach · consistent break', surfBonus:1.0 },
  { id:'neurim',  name:'Neurim',  lat:32.3950, lon:34.8510, desc:'North Netanya · surfing center',      surfBonus:0.5 },
  { id:'argaman', name:'Argaman', lat:32.3380, lon:34.8450, desc:'Central · narrow, peaceful',          surfBonus:0   },
  { id:'sironit', name:'Sironit', lat:32.3355, lon:34.8465, desc:'City beach · lifeguards · families',  surfBonus:-0.5},
  { id:'herzl',   name:'Herzl',   lat:32.3320, lon:34.8475, desc:'Water sports · lively',              surfBonus:0   },
  { id:'bluebay', name:'Blue Bay',lat:32.3500, lon:34.8430, desc:'Northernmost Netanya beach',          surfBonus:0   },
];

// ── State ──────────────────────────────────────────────────────────
let beachData = {};   // id → { marine, wind, scores }
let activeTab = 'surf';
let lastLoaded = null;

// ── Open-Meteo URLs ────────────────────────────────────────────────
function marineUrl(lat, lon) {
  const vars = 'wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,swell_wave_peak_period,wind_wave_height,wind_wave_period';
  return `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=${vars}&timezone=auto&forecast_days=3`;
}

function weatherUrl(lat, lon) {
  const vars = 'wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m';
  return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=${vars}&current=${vars}&timezone=auto`;
}

// ── Fetch helpers ──────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Find current hour index ────────────────────────────────────────
function currentHourIndex(times) {
  const now = new Date();
  const prefix = now.toISOString().slice(0, 13); // "2024-01-01T12"
  // API times are local, so match on HH only by comparing local hour
  const localHour = now.getHours();
  // Find closest past time
  let best = 0;
  for (let i = 0; i < times.length; i++) {
    const t = new Date(times[i]);
    if (t <= now) best = i;
    else break;
  }
  return best;
}

// ── Wind quality for Netanya (coast faces west, offshore = from east ~90°) ──
function windQuality(windDir, windSpeed) {
  // Angular difference from pure offshore (90° = from east)
  let diff = Math.abs(windDir - 90);
  if (diff > 180) diff = 360 - diff;
  // 0 = pure offshore, 180 = pure onshore
  const isOffshore = diff < 70;
  const isOnshore  = diff > 110;

  const kmh = windSpeed; // API returns km/h

  if (kmh < 5)  return { label: 'Glassy', bonus: 3, type: 'offshore', icon: '🪟' };
  if (isOffshore) {
    if (kmh < 20) return { label: 'Offshore', bonus: 2, type: 'offshore', icon: '✅' };
    if (kmh < 35) return { label: 'Offshore (strong)', bonus: 1, type: 'offshore', icon: '💨' };
    return { label: 'Very strong offshore', bonus: 0, type: 'offshore', icon: '💨' };
  }
  if (!isOnshore) { // cross-shore
    if (kmh < 20) return { label: 'Cross-shore', bonus: 1, type: 'cross', icon: '↔️' };
    return { label: 'Cross-shore (strong)', bonus: 0, type: 'cross', icon: '↔️' };
  }
  // Onshore
  if (kmh < 10) return { label: 'Light onshore', bonus: 0, type: 'onshore', icon: '⚠️' };
  if (kmh < 20) return { label: 'Onshore', bonus: -1, type: 'onshore', icon: '❌' };
  if (kmh < 35) return { label: 'Strong onshore', bonus: -2, type: 'onshore', icon: '❌' };
  return { label: 'Very strong onshore', bonus: -3, type: 'onshore', icon: '❌' };
}

// ── Scoring algorithms ─────────────────────────────────────────────
function scoreColor(s) {
  if (s >= 8) return 'great';
  if (s >= 6) return 'good';
  if (s >= 4) return 'fair';
  if (s >= 2) return 'poor';
  return 'bad';
}

function condLabel(s) {
  if (s >= 8) return ['Great', 'great'];
  if (s >= 6) return ['Good', 'good'];
  if (s >= 4) return ['Fair', 'fair'];
  if (s >= 2) return ['Poor', 'poor'];
  return ['Flat/Blown', 'bad'];
}

function calcSurfScore(waveH, swellPeriod, windSpeed, windDir, bonus) {
  // Height: 0–4 pts
  let hPts = 0;
  if      (waveH >= 2.0) hPts = 4.0;
  else if (waveH >= 1.5) hPts = 3.5;
  else if (waveH >= 1.0) hPts = 3.0;
  else if (waveH >= 0.7) hPts = 2.5;
  else if (waveH >= 0.5) hPts = 2.0;
  else if (waveH >= 0.3) hPts = 1.0;
  // else 0

  // Swell period: 0–3 pts
  let pPts = 0;
  if      (swellPeriod >= 14) pPts = 3.0;
  else if (swellPeriod >= 12) pPts = 2.5;
  else if (swellPeriod >= 10) pPts = 2.0;
  else if (swellPeriod >= 8)  pPts = 1.5;
  else if (swellPeriod >= 6)  pPts = 1.0;
  else if (swellPeriod >= 4)  pPts = 0.5;

  // Wind: –3 to +3 pts
  const wq = windQuality(windDir, windSpeed);
  const wPts = wq.bonus;

  const raw = hPts + pPts + wPts + (bonus || 0);
  return Math.round(Math.min(10, Math.max(0, raw)));
}

function calcSupScore(waveH, windSpeed, windDir) {
  let score = 10;
  const kmh = windSpeed;
  // Wind penalty (SUP very sensitive to wind)
  if (kmh > 37)      score -= 6;
  else if (kmh > 28) score -= 4;
  else if (kmh > 19) score -= 2;
  else if (kmh > 10) score -= 1;

  // Offshore wind danger (can blow you out) — extra penalty
  let diff = Math.abs(windDir - 90);
  if (diff > 180) diff = 360 - diff;
  if (diff < 70 && kmh > 20) score -= 2;

  // Wave penalty
  if      (waveH > 1.5) score -= 4;
  else if (waveH > 1.0) score -= 2;
  else if (waveH > 0.7) score -= 1;

  return Math.round(Math.min(10, Math.max(0, score)));
}

function calcKayakScore(waveH, windSpeed) {
  let score = 10;
  const kmh = windSpeed;
  if (kmh > 46)      score -= 6;
  else if (kmh > 37) score -= 4;
  else if (kmh > 28) score -= 2;
  else if (kmh > 19) score -= 1;

  if      (waveH > 2.0) score -= 4;
  else if (waveH > 1.5) score -= 2;
  else if (waveH > 1.0) score -= 1;

  return Math.round(Math.min(10, Math.max(0, score)));
}

// ── Direction label ────────────────────────────────────────────────
function dirLabel(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

// ── Load all beach data ────────────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  document.getElementById('status-msg').style.display = 'block';
  document.getElementById('status-msg').textContent = 'Fetching ocean data…';
  document.getElementById('cards-grid').style.display = 'none';
  document.getElementById('best-banner').style.display = 'none';

  try {
    // Fetch marine data per beach + one shared weather fetch (wind is uniform over ~10km)
    const marinePromises = BEACHES.map(b => fetchJSON(marineUrl(b.lat, b.lon)));
    const weatherPromise = fetchJSON(weatherUrl(32.334, 34.849)); // Netanya center

    const marineResults = await Promise.all(marinePromises);
    const weatherResult = await weatherPromise;

    // Parse wind from current block
    const wCur = weatherResult.current;
    const windSpeed = wCur.wind_speed_10m;
    const windDir   = wCur.wind_direction_10m;
    const windGust  = wCur.wind_gusts_10m;
    const airTemp   = wCur.temperature_2m;

    // Parse hourly wind for forecast
    const wHourly = weatherResult.hourly;

    // Process each beach
    BEACHES.forEach((beach, i) => {
      const m = marineResults[i];
      const h = m.hourly;
      const idx = currentHourIndex(h.time);

      const waveH      = h.wave_height[idx]         ?? 0;
      const waveDir    = h.wave_direction[idx]       ?? 0;
      const wavePeriod = h.wave_period[idx]          ?? 0;
      const swellH     = h.swell_wave_height[idx]    ?? 0;
      const swellDir   = h.swell_wave_direction[idx] ?? 0;
      const swellPer   = h.swell_wave_period[idx]    ?? 0;
      const swellPeak  = h.swell_wave_peak_period[idx] ?? swellPer;
      const windWaveH  = h.wind_wave_height[idx]     ?? 0;
      const windWavePer= h.wind_wave_period[idx]     ?? 0;

      const surf  = calcSurfScore(waveH, swellPer || wavePeriod, windSpeed, windDir, beach.surfBonus);
      const sup   = calcSupScore(waveH, windSpeed, windDir);
      const kayak = calcKayakScore(waveH, windSpeed);

      // Build 12-hour forecast (current hour + next 11)
      const forecast = [];
      for (let f = 0; f < 12; f++) {
        const fi = idx + f;
        if (fi >= h.time.length) break;
        const wi = wHourly.time.findIndex(t => t === h.time[fi]);
        const fWind  = wi >= 0 ? wHourly.wind_speed_10m[wi]    : windSpeed;
        const fWindD = wi >= 0 ? wHourly.wind_direction_10m[wi]: windDir;
        const fWaveH = h.wave_height[fi] ?? waveH;
        const fSwellP= h.swell_wave_period[fi] ?? swellPer;
        forecast.push({
          time: h.time[fi],
          waveH: fWaveH,
          swellPeriod: fSwellP,
          windSpeed: fWind,
          windDir: fWindD,
          surf:  calcSurfScore(fWaveH, fSwellP || wavePeriod, fWind, fWindD, beach.surfBonus),
          sup:   calcSupScore(fWaveH, fWind, fWindD),
          kayak: calcKayakScore(fWaveH, fWind),
        });
      }

      beachData[beach.id] = {
        waveH, waveDir, wavePeriod,
        swellH, swellDir, swellPer, swellPeak,
        windWaveH, windWavePer,
        windSpeed, windDir, windGust, airTemp,
        surf, sup, kayak,
        forecast,
        wq: windQuality(windDir, windSpeed),
      };
    });

    lastLoaded = new Date();
    renderCards();
    renderBestBanner();
  } catch (err) {
    document.getElementById('status-msg').textContent = '⚠️ Failed to load data. ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

// ── Activity tab ───────────────────────────────────────────────────
function setTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.activity-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
  renderBestBanner();
}

function tabScore(data, tab) {
  if (tab === 'surf')  return data.surf;
  if (tab === 'sup')   return data.sup;
  if (tab === 'kayak') return data.kayak;
  return Math.round((data.surf + data.sup + data.kayak) / 3);
}

// ── Render cards ───────────────────────────────────────────────────
function renderCards() {
  const grid = document.getElementById('cards-grid');
  document.getElementById('status-msg').style.display = 'none';
  grid.style.display = 'grid';

  // Sort by active tab score desc
  const sorted = [...BEACHES].sort((a, b) =>
    tabScore(beachData[b.id], activeTab) - tabScore(beachData[a.id], activeTab)
  );
  const bestId = sorted[0].id;

  grid.innerHTML = sorted.map(beach => {
    const d = beachData[beach.id];
    const isBest = beach.id === bestId;
    const sc = scoreColor;

    const surfC  = sc(d.surf);
    const supC   = sc(d.sup);
    const kayakC = sc(d.kayak);
    const mainScore = tabScore(d, activeTab);

    return `
    <div class="beach-card ${isBest ? 'best-card' : ''}" id="card-${beach.id}">
      <div class="card-header">
        <div>
          <div class="beach-name">${beach.name} <span class="best-badge">★ Best</span></div>
          <div class="beach-desc">${beach.desc}</div>
        </div>
      </div>
      <div class="scores-row">
        <div class="score-item">
          <div class="score-ring s-${surfC}">
            <span class="score-num">${d.surf}</span>
            <span class="score-max">/10</span>
          </div>
          <span class="score-label">🏄 Surf</span>
        </div>
        <div class="score-item">
          <div class="score-ring s-${supC}">
            <span class="score-num">${d.sup}</span>
            <span class="score-max">/10</span>
          </div>
          <span class="score-label">🏄‍♂️ SUP</span>
        </div>
        <div class="score-item">
          <div class="score-ring s-${kayakC}">
            <span class="score-num">${d.kayak}</span>
            <span class="score-max">/10</span>
          </div>
          <span class="score-label">🚣 Kayak</span>
        </div>
      </div>
      <div class="quick-stats">
        <div class="quick-stat">
          <span class="qs-val">${d.waveH.toFixed(1)}m</span>
          <span class="qs-key">Waves</span>
        </div>
        <div class="quick-stat">
          <span class="qs-val">${Math.round(d.swellPer || d.wavePeriod)}s</span>
          <span class="qs-key">Period</span>
        </div>
        <div class="quick-stat">
          <span class="qs-val">${Math.round(d.windSpeed)} km/h</span>
          <span class="qs-key">Wind</span>
        </div>
        <div class="quick-stat">
          <span class="qs-val">${dirLabel(d.windDir)}</span>
          <span class="qs-key">Direction</span>
        </div>
      </div>
      <button class="details-btn" onclick="openModal('${beach.id}')">Details &amp; Forecast ▾</button>
    </div>`;
  }).join('');

  // Update timestamp
  if (lastLoaded) {
    const mins = Math.round((Date.now() - lastLoaded) / 60000);
    document.getElementById('last-updated').textContent =
      mins < 1 ? 'Just updated' : `Updated ${mins}m ago`;
  }
}

// ── Best beach banner ──────────────────────────────────────────────
function renderBestBanner() {
  const sorted = [...BEACHES].sort((a, b) =>
    tabScore(beachData[b.id], activeTab) - tabScore(beachData[a.id], activeTab)
  );
  const best = sorted[0];
  const d = beachData[best.id];
  const score = tabScore(d, activeTab);
  const [label] = condLabel(score);

  document.getElementById('best-beach-name').textContent = best.name;
  document.getElementById('best-beach-sub').textContent =
    `${label} · ${d.waveH.toFixed(1)}m waves · ${dirLabel(d.windDir)} wind`;
  document.getElementById('best-banner').style.display = 'block';
}

// ── Modal ──────────────────────────────────────────────────────────
function openModal(beachId) {
  const beach = BEACHES.find(b => b.id === beachId);
  const d = beachData[beachId];
  const wq = d.wq;

  document.getElementById('modal-beach-name').textContent = beach.name;

  const [surfLabel, surfCls]   = condLabel(d.surf);
  const [supLabel, supCls]     = condLabel(d.sup);
  const [kayakLabel, kayakCls] = condLabel(d.kayak);

  const forecastRows = d.forecast.map((f, i) => {
    const t = new Date(f.time);
    const timeStr = i === 0 ? 'Now' :
      t.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    const sc = scoreColor(tabScore(f, activeTab));
    const pillColors = {
      great: '#edfaf1;color:#2dc653',
      good:  '#f3fbed;color:#5aab2a',
      fair:  '#fefae0;color:#c49a00',
      poor:  '#fff3e6;color:#f4811f',
      bad:   '#fdf0f1;color:#e63946',
    };
    const pill = pillColors[sc];
    return `<tr>
      <td>${timeStr}</td>
      <td>${f.waveH.toFixed(1)}m</td>
      <td>${Math.round(f.swellPeriod)}s</td>
      <td>${Math.round(f.windSpeed)} <small>${dirLabel(f.windDir)}</small></td>
      <td><span class="score-pill" style="background:${pill.split(';')[0]};${pill.split(';')[1]}">${tabScore(f, activeTab)}</span></td>
    </tr>`;
  }).join('');

  const actLabel = activeTab === 'surf' ? 'Surf' : activeTab === 'sup' ? 'SUP' : activeTab === 'kayak' ? 'Kayak' : 'Overall';

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <h3>Activity Scores</h3>
      <div class="modal-scores">
        <div class="modal-score-item">
          <span class="act-icon">🏄</span>
          <span class="act-score" style="color:var(--${scoreColor(d.surf)==='great'?'green':scoreColor(d.surf)==='good'?'green':scoreColor(d.surf)==='fair'?'yellow':scoreColor(d.surf)==='poor'?'orange':'red'})">${d.surf}</span>
          <span class="act-label">Surf</span>
          <span class="cond-label cond-${scoreColor(d.surf)}">${surfLabel}</span>
        </div>
        <div class="modal-score-item">
          <span class="act-icon">🏄‍♂️</span>
          <span class="act-score">${d.sup}</span>
          <span class="act-label">SUP</span>
          <span class="cond-label cond-${scoreColor(d.sup)}">${supLabel}</span>
        </div>
        <div class="modal-score-item">
          <span class="act-icon">🚣</span>
          <span class="act-score">${d.kayak}</span>
          <span class="act-label">Kayak</span>
          <span class="cond-label cond-${scoreColor(d.kayak)}">${kayakLabel}</span>
        </div>
      </div>
    </div>

    <div class="modal-section">
      <h3>Current Conditions</h3>
      <div class="detail-grid">
        <div class="detail-cell">
          <div class="dc-val">${d.waveH.toFixed(2)} m</div>
          <div class="dc-key">Wave Height</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${d.swellH.toFixed(2)} m</div>
          <div class="dc-key">Swell Height</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${Math.round(d.swellPer || d.wavePeriod)} s</div>
          <div class="dc-key">Swell Period</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${Math.round(d.swellPeak)} s</div>
          <div class="dc-key">Peak Period</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${dirLabel(d.swellDir)} (${Math.round(d.swellDir)}°)</div>
          <div class="dc-key">Swell Direction</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${d.windWaveH.toFixed(2)} m</div>
          <div class="dc-key">Wind Wave Height</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${Math.round(d.windSpeed)} km/h</div>
          <div class="dc-key">Wind Speed</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${Math.round(d.windGust)} km/h</div>
          <div class="dc-key">Wind Gusts</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${dirLabel(d.windDir)} (${Math.round(d.windDir)}°)</div>
          <div class="dc-key">Wind Direction</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${wq.icon} ${wq.label}</div>
          <div class="dc-key">Wind Quality</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${d.waveDir !== undefined ? dirLabel(d.waveDir) : '—'}</div>
          <div class="dc-key">Wave Direction</div>
        </div>
        <div class="detail-cell">
          <div class="dc-val">${Math.round(d.airTemp)}°C</div>
          <div class="dc-key">Air Temp</div>
        </div>
      </div>
    </div>

    <div class="modal-section" style="padding-bottom:16px">
      <h3>12-Hour Forecast · ${actLabel}</h3>
      <table class="forecast-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Waves</th>
            <th>Period</th>
            <th>Wind</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody>${forecastRows}</tbody>
      </table>
    </div>
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── Auto-refresh timestamp every minute ───────────────────────────
setInterval(() => {
  if (lastLoaded && Object.keys(beachData).length) {
    const mins = Math.round((Date.now() - lastLoaded) / 60000);
    document.getElementById('last-updated').textContent =
      mins < 1 ? 'Just updated' : `Updated ${mins}m ago`;
  }
}, 60000);

// ── Boot ───────────────────────────────────────────────────────────
loadAll();
</script>
