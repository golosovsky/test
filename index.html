<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>605 - עודים</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .container { max-width: 480px; margin: 0 auto; }

    header { text-align: center; padding: 16px 0 8px; }

    .bus-badge {
      display: inline-block;
      background: #2563eb;
      color: white;
      font-size: 2rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 12px;
      margin-bottom: 6px;
    }

    .direction { color: #94a3b8; font-size: 0.9rem; }

    .search-section { margin: 12px 0; }

    .search-row { display: flex; gap: 8px; }

    .search-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px; /* prevents iOS zoom */
      outline: none;
      direction: rtl;
    }

    .search-row input:focus { border-color: #2563eb; }

    .search-row button, .refresh-btn {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .search-row button:active, .refresh-btn:active { background: #1d4ed8; }

    .stops-list {
      margin-top: 8px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    .stop-option {
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid #334155;
      transition: background 0.1s;
    }

    .stop-option:last-child { border-bottom: none; }
    .stop-option:active { background: #334155; }

    .stop-option.selected {
      background: #1e3a5f;
      border-right: 3px solid #2563eb;
    }

    .stop-name { font-weight: 600; }
    .stop-code { font-size: 0.8rem; color: #64748b; margin-top: 2px; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 0.8rem;
      color: #64748b;
    }

    .refresh-btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      background: #334155;
      border-radius: 8px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px;
    }

    .status-dot.live { background: #22c55e; animation: pulse 2s infinite; }
    .status-dot.error { background: #ef4444; }
    .status-dot.loading { background: #eab308; animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .arrivals { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

    .arrival-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #334155;
    }

    .arrival-left { display: flex; align-items: center; gap: 12px; }

    .line-number {
      background: #2563eb;
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      width: 52px; height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .arrival-dest { font-size: 0.85rem; color: #94a3b8; }
    .arrival-rt { font-size: 0.75rem; color: #475569; margin-top: 2px; }
    .arrival-right { text-align: left; flex-shrink: 0; }

    .arrival-min {
      font-size: 1.8rem;
      font-weight: 800;
      color: #22c55e;
      line-height: 1;
    }

    .arrival-min.soon { color: #eab308; }
    .arrival-min.now { color: #ef4444; font-size: 1.3rem; }

    .arrival-label { font-size: 0.75rem; color: #64748b; }
    .arrival-time { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

    .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    .other-lines { margin-top: 20px; }
    .other-lines h3 { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; font-weight: 500; }

    .other-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #273548;
      margin-bottom: 6px;
    }

    .other-card .line-number {
      background: #475569;
      width: 40px; height: 40px;
      font-size: 0.95rem;
    }

    .other-card .arrival-min { font-size: 1.2rem; color: #94a3b8; }

    .saved-stop {
      margin-top: 8px;
      padding: 10px 16px;
      background: #1e3a5f;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #2563eb44;
    }

    .saved-stop:active { background: #253e6a; }
    .saved-label { font-size: 0.8rem; color: #64748b; }
    .saved-name { font-weight: 600; }
    .saved-clear { color: #64748b; font-size: 0.8rem; padding: 4px 8px; }

    .tip {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      background: #1e293b;
      border-radius: 10px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="bus-badge">605</div>
      <div class="direction">&#x2193; דרום &mdash; עודים</div>
    </header>

    <div class="search-section">
      <div class="search-row">
        <input type="text" id="searchInput" inputmode="search" placeholder="חפש תחנה (שם או מספר)..." value="עודים">
        <button onclick="searchStops()">חפש</button>
      </div>
      <div id="savedStop" style="display:none" class="saved-stop"></div>
      <div id="stopsList" class="stops-list" style="display:none"></div>
    </div>

    <div class="status-bar">
      <span id="statusText">טוען...</span>
      <button class="refresh-btn" onclick="loadArrivals()">רענן</button>
    </div>

    <div id="arrivals" class="arrivals">
      <div class="empty-state">
        <div class="icon">&#128652;</div>
        <div>בחר תחנה כדי לראות זמני הגעה</div>
      </div>
    </div>

    <div id="otherLines" class="other-lines" style="display:none">
      <h3>קווים נוספים בתחנה</h3>
      <div id="otherLinesContent"></div>
    </div>

    <div class="tip">
      מתעדכן אוטומטית כל 30 שניות &bull; אפס אחסון = 0 התקנות
    </div>
  </div>

  <script>
    let selectedStopId = null;
    let refreshInterval = null;

    // --- API layer: always use CORS proxy when on file:// ---
    const SEARCH_BASE = 'https://app.busnearby.co.il/stopSearch';
    const TIMES_BASE  = 'https://api.busnearby.co.il/directions/index/stops';
    const PROXY       = 'https://corsproxy.io/?';

    function needsProxy() {
      return location.protocol === 'file:' || location.hostname === 'localhost';
    }

    async function apiFetch(url) {
      if (needsProxy()) {
        const res = await fetch(PROXY + encodeURIComponent(url));
        if (!res.ok) throw new Error(res.status);
        return res.json();
      }
      // On HTTPS (e.g. GitHub Pages) try direct first
      try {
        const res = await fetch(url);
        if (res.ok) return res.json();
      } catch (_) {}
      const res = await fetch(PROXY + encodeURIComponent(url));
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    // --- LocalStorage for remembered stop ---
    function saveStop(id, name) {
      try { localStorage.setItem('bus605_stop', JSON.stringify({ id, name })); } catch (_) {}
    }
    function loadSavedStop() {
      try { return JSON.parse(localStorage.getItem('bus605_stop')); } catch (_) { return null; }
    }
    function clearSavedStop() {
      try { localStorage.removeItem('bus605_stop'); } catch (_) {}
      selectedStopId = null;
      document.getElementById('savedStop').style.display = 'none';
      document.getElementById('arrivals').innerHTML = `
        <div class="empty-state"><div class="icon">&#128652;</div><div>בחר תחנה כדי לראות זמני הגעה</div></div>`;
      document.getElementById('otherLines').style.display = 'none';
      if (refreshInterval) clearInterval(refreshInterval);
      setStatus('live', '');
    }

    function showSavedStop(name) {
      const el = document.getElementById('savedStop');
      el.style.display = 'flex';
      el.innerHTML = `
        <div><div class="saved-label">תחנה נבחרת</div><div class="saved-name">${esc(name)}</div></div>
        <div class="saved-clear" onclick="event.stopPropagation(); clearSavedStop()">&#x2715;</div>`;
    }

    // --- Search ---
    async function searchStops() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const listEl = document.getElementById('stopsList');
      listEl.style.display = 'block';
      listEl.innerHTML = '<div class="stop-option">מחפש...</div>';

      try {
        const stops = await apiFetch(`${SEARCH_BASE}?query=${encodeURIComponent(query)}&locale=he`);
        if (!stops || !stops.length) {
          listEl.innerHTML = '<div class="stop-option">לא נמצאו תחנות</div>';
          return;
        }
        listEl.innerHTML = stops.map((s, i) => `
          <div class="stop-option" onclick="pickStop('${s.stop_id}','${esc(s.stop_name)}',this)">
            <div class="stop-name">${esc(s.stop_name)}</div>
            <div class="stop-code">קוד תחנה: ${s.stop_code || s.stop_id}</div>
          </div>`).join('');
      } catch (e) {
        listEl.innerHTML = '<div class="stop-option">שגיאה בחיפוש - בדוק חיבור אינטרנט</div>';
      }
    }

    function pickStop(id, name, el) {
      selectedStopId = id;
      saveStop(id, name);
      showSavedStop(name);

      document.querySelectorAll('.stop-option').forEach(e => e.classList.remove('selected'));
      if (el) el.classList.add('selected');
      setTimeout(() => { document.getElementById('stopsList').style.display = 'none'; }, 200);

      loadArrivals();
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(loadArrivals, 30000);
    }

    // --- Load arrivals ---
    async function loadArrivals() {
      if (!selectedStopId) return;
      setStatus('loading', 'מעדכן...');

      try {
        const now = Math.floor(Date.now() / 1000);
        const data = await apiFetch(
          `${TIMES_BASE}/1:${selectedStopId}/stoptimes?numberOfDepartures=3&timeRange=7200&startTime=${now}&locale=he`
        );

        if (!data || data.error) { setStatus('error', 'שגיאה בטעינת נתונים'); return; }

        const allBuses = [];
        for (const entry of data) {
          if (!entry.times || !entry.times.length) continue;
          for (const t of entry.times) {
            const ts = t.serviceDay + (t.realtimeArrival || t.scheduledArrival);
            const diff = ts - now;
            if (diff < -60) continue;
            allBuses.push({
              line: t.routeShortName || '?',
              dest: t.tripHeadsign || '',
              min: Math.max(0, Math.round(diff / 60)),
              ts,
              rt: !!t.realtime,
            });
          }
        }

        allBuses.sort((a, b) => a.ts - b.ts);
        render605(allBuses.filter(b => b.line === '605'));
        renderOther(allBuses.filter(b => b.line !== '605'));

        const t = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setStatus('live', `עדכון אחרון: ${t}`);
      } catch (e) {
        setStatus('error', 'שגיאת חיבור - בדוק אינטרנט');
      }
    }

    // --- Render ---
    function render605(buses) {
      const el = document.getElementById('arrivals');
      if (!buses.length) {
        el.innerHTML = `<div class="empty-state"><div class="icon">&#128652;</div>
          <div>אין אוטובוסים של קו 605 בקרוב</div>
          <div style="margin-top:8px;font-size:0.8rem">בדוק שבחרת את התחנה הנכונה (כיוון דרום)</div></div>`;
        return;
      }
      el.innerHTML = buses.map(b => {
        const time = new Date(b.ts * 1000).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
        let cls = '', txt = `${b.min}`, lbl = 'דקות';
        if (b.min <= 1) { cls = 'now'; txt = 'עכשיו'; lbl = ''; }
        else if (b.min <= 5) { cls = 'soon'; }
        return `<div class="arrival-card">
          <div class="arrival-left">
            <div class="line-number">605</div>
            <div><div class="arrival-dest">${esc(b.dest)}</div>
              <div class="arrival-rt">${b.rt ? '&#x1F4E1; זמן אמת' : '&#x1F4C5; לוח זמנים'}</div></div>
          </div>
          <div class="arrival-right">
            <div class="arrival-min ${cls}">${txt}</div>
            <div class="arrival-label">${lbl}</div>
            <div class="arrival-time">${time}</div>
          </div></div>`;
      }).join('');
    }

    function renderOther(buses) {
      const sec = document.getElementById('otherLines');
      const el = document.getElementById('otherLinesContent');
      if (!buses.length) { sec.style.display = 'none'; return; }
      const seen = new Set();
      const uniq = buses.filter(b => { if (seen.has(b.line)) return false; seen.add(b.line); return true; }).slice(0, 8);
      sec.style.display = 'block';
      el.innerHTML = uniq.map(b => `<div class="other-card">
        <div class="arrival-left">
          <div class="line-number">${esc(b.line)}</div>
          <div class="arrival-dest" style="margin-right:8px">${esc(b.dest)}</div>
        </div>
        <div class="arrival-right">
          <div class="arrival-min">${b.min <= 1 ? 'עכשיו' : b.min}</div>
          <div class="arrival-label">${b.min > 1 ? 'דקות' : ''}</div>
        </div></div>`).join('');
    }

    function setStatus(type, text) {
      document.getElementById('statusText').innerHTML = `<span class="status-dot ${type}"></span> ${text}`;
    }

    function esc(s) {
      if (!s) return '';
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') searchStops();
      });

      // Restore saved stop
      const saved = loadSavedStop();
      if (saved) {
        selectedStopId = saved.id;
        showSavedStop(saved.name);
        loadArrivals();
        refreshInterval = setInterval(loadArrivals, 30000);
      } else {
        searchStops();
      }
    });
  </script>
</body>
</html>
