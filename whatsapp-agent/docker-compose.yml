services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-grandpa
    restart: unless-stopped
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      # Host directory for all OpenClaw state (sessions, credentials, logs).
      # DO NOT use a named Docker volume here — it causes EBUSY errors when
      # combined with bind mounts into subdirectories.
      - ~/.openclaw:/home/node/.openclaw
      # Workspace for agent file operations
      - ./workspace:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - "${OPENCLAW_GATEWAY_BIND:-lan}"
      - --port
      - "18789"
