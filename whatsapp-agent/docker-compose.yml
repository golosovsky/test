services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-grandpa
    restart: unless-stopped
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    volumes:
      # OpenClaw state (sessions, credentials, logs)
      - openclaw-state:/home/node/.openclaw
      # Our custom config
      - ./openclaw.json:/home/node/.openclaw/openclaw.json:ro
      # Our custom skill
      - ./skills:/home/node/.openclaw/skills:ro
      # Workspace for agent file operations
      - ./workspace:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command:
      - node
      - dist/index.js
      - gateway
      - --bind
      - "${OPENCLAW_GATEWAY_BIND:-lan}"
      - --port
      - "18789"
    # Health check - restart if gateway stops responding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openclaw-state:
    driver: local
